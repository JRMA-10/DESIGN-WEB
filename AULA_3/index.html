<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curriculo</title>
</head>
<body>
    <form action="">
        <!-- Pode ter várias marcações de form em uma só página, cada uma com um propósito: busca, login, enquete, cadastro, contato -->
        <label for="nome">Nome: </label>
        <input type="text" id="nome" required> <br>

        <p>Qual sua área? <br>
            <label>
                <input type="checkbox" name='area' id="design value="design">Design
                <!-- 
                - Não é mecessário colocar o for na label quando o input está dentro
                - O atributo de name representa o grupo,
                - O atributo de value precisa ser definido e recebe o valor
                - O atributo de value precisa ser definido e recebe o valor (é como se fosse o valor digitado em um campo de texto)
                -->

            </label> <br>
            <label>
                <input type="checkbox" name='area' id="prog"   value="prog">Programação
            </label> <br>
            <label>
                <input type="checkbox" name='area' id="redes" value="redes">Redes
            </label> <br>
        </p>
        <p>Qual seu curso: <br>
            <label>
                <input type="radio" name="curso" value="infoweb">Infoweb
                <!--  -->
            </label> <br>
            <label>
                <input type="radio" name="curso" value="adm">ADM
            </label> <br>
            <label>
                <input type="radio" name="curso" value="msi">Manutenção e Suporte
            </label>
        </p>
        <fieldset>
            <!-- Fieldset é um componente opcional e usado para organizar o formulário visualmente -->
            <legend>MENSAGEM</legend>
            <label for="mensagem">
                Mensagem: <br>
                <textarea name="msn" id="mensagem" cols="30" rows="10" maxlength="50"></textarea>
                <!-- 
                - Esta marcação tem uma abertura e fechamento porque permite um texto longo com "enter" s
                - Os atributos de formatação cols e rows são permitidos, mesmo sendo de formatação
                - Difere do input do text porque aceita texto longo
                - O 'Value' é o texto dentro da marcação
                -->
            </label>
        </fieldset>
        <label for="idade">
            Idade: <br>
            <input type="number" id="idade" max="10" min="3">
            <!--  -->
        </label> <br>

        <label for="cidade">
            Cidade: <br>
            <input type="text" id="cidade" list="list-cidade">
        </label>
        <!-- 
        - datalist é um componente novo, imilar ao combobox, a diferença é que ele permite que o usuário digite ou selecione uma opção
        - Se relaciona com o input com o atributo 'list'
        -->
        <datalist id="list-cidade">
            <option value="Recife">
            <option value="Natal">
            <option value="João Pessoa">
            <option value="Fortaleza">
        </datalist>

        <input type="hidden" id="id-user" value="5487">

        <input type="submit" value="Enviar" disabled>

    </form>
</body>
</html>
